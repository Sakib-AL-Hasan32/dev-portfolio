<!doctype html>
<html lang="en">
<head>
{{head}}
<meta name="robots" content="noindex">
</head>
<body data-page="404">
{{chrome}}
{{nav}}
<main id="main" class="notfound container">
  <div class="notfound__code" aria-hidden="true"><span>4</span><span class="grad">0</span><span>4</span></div>
  <div class="code-window notfound__term" data-hero-in style="--i:1">
    <div class="code-window__bar"><span class="cover__dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="code-window__file">{{icon:terminal}} response</span></div>
<pre class="code-window__body"><code><span class="tk-kw">HTTP/1.1</span> <span class="tk-st">404 Not Found</span>
{ <span class="tk-ty">"message"</span>: <span class="tk-st">"This endpoint doesn't exist."</span> }</code></pre>
  </div>
  <h1 class="notfound__title" data-hero-in style="--i:2">Page not found</h1>
  <p class="notfound__text" data-hero-in style="--i:3">The page you're looking for has moved or never existed.</p>
  <div class="notfound__ctas" data-hero-in style="--i:4">
    <a class="btn btn--primary" href="{{root}}">{{icon:arrow-left}}Back home</a>
    <a class="btn btn--ghost" href="{{root}}projects/">Browse projects</a>
  </div>
</main>
{{footer}}
</body>
</html>
